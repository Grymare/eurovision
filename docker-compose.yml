services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      DATABASE_PATH: /app/data/app.db
      # Override localhost values from .env.local when running Docker for production hosting.
      AUTH_URL: https://eurovision.grymare.com
      PUBLIC_APP_URL: https://eurovision.grymare.com
    volumes:
      - app-data:/app/data
      - eurovision-datasets-data:/app/eurovision-datasets
    restart: unless-stopped

volumes:
  app-data:
  eurovision-datasets-data:
